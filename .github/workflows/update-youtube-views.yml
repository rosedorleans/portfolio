name: Update project statistics

on:
  push:
    branches:
      - main
    paths:
      - "data/portfolio.json"
      - "scripts/**"
      - "lib/**"
      - ".github/workflows/update-youtube-views.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-statistics
  cancel-in-progress: false

jobs:
  update-youtube-views:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/update-youtube-views.mjs

      - run: node scripts/update-steam-reviews.mjs

      - name: Commit updated statistics
        run: |
          if git diff --quiet data/youtube-views.json data/steam-reviews.json; then
            echo "No project statistics changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-views.json data/steam-reviews.json
          git commit -m "Update project statistics"
          git pull --rebase origin main
          git push
